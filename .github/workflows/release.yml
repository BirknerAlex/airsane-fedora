name: Build and publish

on:
  push:
    branches: [main]
    tags: ["r*"]   # r<N>: package release number, e.g. r2
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.package }} (Fedora ${{ matrix.fedora }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: airsane, fedora: "45", arch: x86_64, runner: ubuntu-latest }
          - { package: sane-backends, fedora: "45", arch: x86_64, runner: ubuntu-latest }
    container: fedora:${{ matrix.fedora }}
    steps:
      - run: dnf install -y git
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Tag r2 -> package release 2. Branch builds use release 0.
      - name: Resolve release
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "RELEASE=${GITHUB_REF_NAME#r}" >> "$GITHUB_ENV"
          else
            echo "RELEASE=0" >> "$GITHUB_ENV"
          fi

      - run: ./${{ matrix.package }}/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.package }}-fedora${{ matrix.fedora }}-${{ matrix.arch }}
          path: dist/*.rpm
          retention-days: 7

  publish-silo:
    name: Publish to silo
    needs: build
    if: startsWith(github.ref, 'refs/tags/r')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: rpm-*
          path: dist
          merge-multiple: true

      - uses: BirknerAlex/silo/.github/actions/publish@v0.15.0
        with:
          server: https://silo.tyrola.dev
          token: ${{ secrets.SILO_AIRSANE_TOKEN }}
          repo: airsane
          channel: stable
          files: dist/*.rpm
